# Traducciones al español de los objetos de MissileWarfare. Clave = identificador del objeto de Slimefun.
# name = nombre mostrado, lore = lista de líneas, códigos de color '&'. Los objetos faltantes usan el inglés.

GROUNDLAUNCHER:
  name: "&6Lanzador de misiles tierra-tierra"
  lore:
    - "&7Dispara a un área concreta en el suelo."
    - "&7Usa un palo para fijar las coordenadas objetivo"
    - "&7Debe construirse sobre un bloque de hormigón verde."

ANTIMISSILELAUNCHER:
  name: "&6Lanzador antimisiles"
  lore:
    - "&7Apunta y derriba otros misiles del área."
    - "&7Usa redstone para desactivarlo"
    - "&7Necesita misiles antimisiles"

ANTIELYTRA:
  name: "&6Lanzador antiélitros"
  lore:
    - "&7Dispara un misil a los jugadores cercanos"
    - "&7que usan élitros"
    - "&7Necesita misiles antiélitros"

MANPAD:
  name: "&6Manpad"
  lore:
    - "&7Dispositivo antimisiles portátil"
    - "&7Mayús+Clic derecho para empezar a rastrear"
    - "&7Suelta Mayús para disparar"

MINE:
  name: "&cMina"
  lore:
    - "&7¿Funcionará contra los tanques?"

MISSILE:
  name: "&6Misil tierra-tierra"
  lore:
    - "&7Tu amistoso misil del vecindario"

MISSILEICBM:
  name: "&bMisil ICBM"
  lore:
    - "&7Misil de largo alcance"
    - "&7Misil balístico intercontinental"
    - "&7'Ningún lugar es seguro.'"

MISSILECLUSTER:
  name: "&6Misil de racimo"
  lore:
    - "&7Misil de racimo, despliega muchos misiles antes de impactar"
    - "&7'¡Borra aldeas más rápido de lo que puedes gritar!'"

MISSILENAPALM:
  name: "&6Misil de napalm"
  lore:
    - "&7Misil incendiario"
    - "&7Misil de napalm, lanza fuego por todas partes al impactar."

MISSILEGAS:
  name: "&aMisil de gas"
  lore:
    - "&7Misil de limpieza"
    - "&7Despliega gas tóxico al impactar en un objetivo"
