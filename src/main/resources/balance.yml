# Per-item balance scores (0-100) for MissileWarfare, relative to vanilla Minecraft.
# Read by Slimefun's BalanceService (overrides the auto heuristic). Bands:
#   0-10 Trivial | 11-25 Standard | 26-40 Advanced | 41-69 Powerful | 70-100 Overpowered
#   (vanilla anchors: iron gear ~15, netherite ~30, beacon ~35, end crystal ~70, mace ~85)
# Scores below are derived from actual source values (config.yml "power" = the
# float passed straight into World#createExplosion, i.e. TNT-equivalent blast;
# vanilla TNT/creeper = 4/3) and hardcoded effects in the missile controllers,
# not from item-id tier guessing.
